services:
  postgres:
    image: postgres:16-alpine
    container_name: golf-maintenance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: golfadmin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: golf_maintenance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: